<div class="page">
  <app-nav />

  <main class="main">
    <div class="header">
      <div class="header__text">
        <h1 class="header__title">Lista de alarmas</h1>
        <p class="header__subtitle">Gestiona tus alarmas.</p>
      </div>
    </div>

    <div class="card">
      <div class="table">
        <div class="table__header">
          <div class="table__cell table__cell--med">MEDICAMENTO</div>
          <div class="table__cell table__cell--hora">HORA</div>
          <div class="table__cell table__cell--estado">ESTADO</div>
          <div class="table__cell table__cell--acciones table__cell--right">ACCIONES</div>
        </div>

        <div class="table__body">
          <div class="table__row">
            <div class="table__cell table__cell--med">
              <div class="med-icon">
                <img src="icons/icon-pastilla.svg" width="18" height="18" alt="">
              </div>
              <div class="med-info">
                <span class="med-info__name">Omeprazol</span>
                <span class="med-info__dose">20 mg</span>
              </div>
            </div>
            <div class="table__cell table__cell--hora">8:00 AM</div>
            <div class="table__cell table__cell--estado">
              <span class="badge badge--activa">
                <span class="badge__dot"></span>Activa
              </span>
            </div>
            <div class="table__cell table__cell--acciones"></div>
          </div>

          <div class="table__row table__row--bordered">
            <div class="table__cell table__cell--med">
              <div class="med-icon">
                <img src="icons/icon-medicamento-kit.svg" width="20" height="20" alt="">
              </div>
              <div class="med-info">
                <span class="med-info__name">Capsaicina</span>
                <span class="med-info__dose">1 dosis</span>
              </div>
            </div>
            <div class="table__cell table__cell--hora">12:00 PM</div>
            <div class="table__cell table__cell--estado">
              <span class="badge badge--caducada">
                <span class="badge__dot"></span>Caducada
              </span>
            </div>
            <div class="table__cell table__cell--acciones">
              <button class="btn-recalcular" routerLink="/alarmas/recalcular">Recalcular alarma</button>
            </div>
          </div>

          <div class="table__row table__row--bordered">
            <div class="table__cell table__cell--med">
              <div class="med-icon">
                <img src="icons/icon-frascos.svg" width="19" height="21" alt="">
              </div>
              <div class="med-info">
                <span class="med-info__name">Amoxicilina</span>
                <span class="med-info__dose">200 mg</span>
              </div>
            </div>
            <div class="table__cell table__cell--hora">11:00 PM</div>
            <div class="table__cell table__cell--estado">
              <span class="badge badge--caducada">
                <span class="badge__dot"></span>Caducada
              </span>
            </div>
            <div class="table__cell table__cell--acciones">
              <button class="btn-recalcular" routerLink="/alarmas/recalcular">Recalcular alarma</button>
            </div>
          </div>
        </div>
      </div>

      <div class="pagination">
        <span class="pagination__info">Mostrando 1 a 3 de 3 resultados</span>
        <div class="pagination__pages">
          <button class="pagination__btn pagination__btn--disabled">
            <svg width="6" height="10" viewBox="0 0 6 10" fill="none">
              <path d="M5 1L1 5L5 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="pagination__btn pagination__btn--active">1</button>
          <button class="pagination__btn pagination__btn--disabled">
            <svg width="6" height="10" viewBox="0 0 6 10" fill="none">
              <path d="M1 1L5 5L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  @if (showToast()) {
    <div class="toast">
      <div class="toast__icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" stroke="#006A60" stroke-width="1.5"/>
          <path d="M6.5 10L9 12.5L13.5 7.5" stroke="#006A60" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="toast__text">
        <span class="toast__title">Alarma exitosamente recalculada</span>
        <span class="toast__subtitle">Para Omeprazol</span>
      </div>
      <button class="toast__close" (click)="showToast.set(false)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M4 4L12 12M12 4L4 12" stroke="#051F1C" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  }
</div>
