<div class="page">
  <app-nav />

  <main class="main">
    <div class="header">
      <div class="header__text">
        <h1 class="header__title">Lista de medicamentos</h1>
        <p class="header__subtitle">Gestiona el inventario de medicamentos.</p>
      </div>
      <a class="btn-crear" routerLink="/medicamentos/crear">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Crear Medicamento
      </a>
    </div>

    <div class="meds-grid">
      <div class="med-card">
        <div class="med-card__top">
          <div class="med-card__icon">
            <img src="icons/icon-medicamento-kit.svg" width="22" height="22" alt="">
          </div>
          <div class="med-card__info">
            <span class="med-card__name">Amoxicilina</span>
            <span class="med-card__dose">200 mg</span>
          </div>
        </div>
        <div class="med-card__actions">
          <a class="btn-icon" routerLink="/medicamentos/editar">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
              <path d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13H3v-2L11.5 2.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a class="btn-icon" routerLink="/medicamentos/eliminar-2">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </a>
        </div>
      </div>

      <div class="med-card">
        <div class="med-card__top">
          <div class="med-card__icon">
            <img src="icons/icon-pastilla.svg" width="20" height="20" alt="">
          </div>
          <div class="med-card__info">
            <span class="med-card__name">Paracetamol</span>
            <span class="med-card__dose">1 g</span>
          </div>
        </div>
        <div class="med-card__actions">
          <a class="btn-icon" routerLink="/medicamentos/editar">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
              <path d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13H3v-2L11.5 2.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a class="btn-icon" routerLink="/medicamentos/eliminar-2">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

    <div class="toast">
      <svg class="toast__check" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="10" fill="#006A60"/>
        <path d="M5.5 10l3.5 3.5 5.5-7" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="toast__text">Omeprazol y alarmas asociadas exitosamente eliminadas</span>
      <a class="toast__close" routerLink="/medicamentos/lista-2-sin-notif">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </a>
    </div>
  </main>
</div>
